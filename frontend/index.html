<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <!-- Logo de marca (BLogo) en varios tamaños — favicon.svg queda sin
         referenciar (archivo se deja en /public por si hace falta volver
         atrás, no se borra). -->
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/favicon-192.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- La hoja de la fuente se pide con preload y main.jsx la activa, en vez de
         bloquear el primer render (display=swap ya evita texto invisible). Sin un
         "onload" dentro del propio HTML: la política de seguridad de contenido no
         tiene que permitir scripts en línea. -->
    <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700;800&display=swap" />
    <noscript><link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700;800&display=swap" rel="stylesheet" /></noscript>
    <title>BenjaApis · Panel para streamers de TikTok LIVE</title>
    <!-- Lo que ven los buscadores y la vista previa al compartir un enlace.
         Cada página del panel actualiza la descripción y el canónico al
         abrirse (ver useSectionRouting). -->
    <meta name="description" content="Panel para streamers de TikTok LIVE: juegos con regalos, alertas, TTS del chat, Spotify y overlays para OBS en un solo lugar. Pruébalo gratis." />
    <link rel="canonical" href="https://benjaapis.dev/" />
    <meta name="theme-color" content="#7C3AED" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="BenjaApis" />
    <meta property="og:locale" content="es_MX" />
    <meta property="og:title" content="BenjaApis · Panel para streamers de TikTok LIVE" />
    <meta property="og:description" content="Juegos con regalos, alertas, TTS del chat, Spotify y overlays para OBS en un solo lugar. Pruébalo gratis." />
    <meta property="og:url" content="https://benjaapis.dev/" />
    <meta property="og:image" content="https://benjaapis.dev/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="BenjaApis · Panel para streamers de TikTok LIVE" />
    <meta name="twitter:description" content="Juegos con regalos, alertas, TTS del chat, Spotify y overlays para OBS en un solo lugar." />
    <meta name="twitter:image" content="https://benjaapis.dev/og-image.png" />
    <!-- Datos estructurados (schema.org): qué es el sitio, para los buscadores.
         Es un bloque de datos (JSON-LD), no un script que se ejecute, así que
         la política de seguridad no necesita permitir scripts en línea. -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "WebSite",
            "@id": "https://benjaapis.dev/#website",
            "url": "https://benjaapis.dev/",
            "name": "BenjaApis",
            "inLanguage": "es-MX"
          },
          {
            "@type": "SoftwareApplication",
            "name": "BenjaApis",
            "url": "https://benjaapis.dev/",
            "applicationCategory": "MultimediaApplication",
            "operatingSystem": "Web",
            "inLanguage": "es-MX",
            "description": "Panel para streamers de TikTok LIVE: juegos con regalos, alertas, TTS del chat, cola de Spotify y overlays para OBS.",
            "image": "https://benjaapis.dev/og-image.png",
            "offers": {
              "@type": "Offer",
              "price": "0",
              "priceCurrency": "MXN",
              "description": "Prueba gratis"
            }
          }
        ]
      }
    </script>
    <!-- AdSense necesita este script presente en el HTML de entrada desde
         el inicio para poder verificar el sitio — el rastreador no navega
         por las pestañas de la app para encontrarlo, así que no puede ir
         inyectado condicionalmente desde React (ver Colorsays.jsx, que
         antes lo cargaba solo al entrar a Color Says). Auto ads decide
         sola dónde insertar anuncios; se mantiene oculto por CSS por
         defecto (body con tkc-ads-suppressed) y Color Says lo destapa solo
         para invitados sin banco de horas activo. -->
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-5961182005770214" crossorigin="anonymous"></script>
  </head>
  <body class="tkc-ads-suppressed">
    <div id="root"><!--tkc-loader--><div class="tkc-boot" role="status" aria-label="Cargando BenjaApis"><img src="/favicon-192.png" alt="" width="48" height="48" /><span class="tkc-boot-ring"></span></div><style>
      /* Pantalla de carga mientras llega el JavaScript: React la reemplaza al
         montar. Sin script en línea (la CSP no lo permite), y aparece con un
         poco de retraso para que en una carga desde caché no llegue a verse.
         El servidor la quita del HTML de los overlays de OBS (ver server.js). */
      .tkc-boot { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 20px; background: #A69AD8; animation: tkc-boot-in 0.3s ease 0.2s backwards; }
      .tkc-boot img { border-radius: 12px; }
      .tkc-boot-ring { width: 22px; height: 22px; border-radius: 999px; border: 2.5px solid #7C3AED; border-right-color: transparent; animation: tkc-boot-spin 0.8s linear infinite; }
      @media (prefers-color-scheme: dark) { .tkc-boot { background: #1B1527; } .tkc-boot-ring { border-color: #C4B5FD; border-right-color: transparent; } }
      @media (prefers-reduced-motion: reduce) { .tkc-boot, .tkc-boot-ring { animation: none; } }
      @keyframes tkc-boot-in { from { opacity: 0; } }
      @keyframes tkc-boot-spin { to { transform: rotate(360deg); } }
    </style><!--/tkc-loader--></div>
    <script type="module" src="/src/main.jsx"></script>
</body>
</html>
